[package]
name = "evm2-frame-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
evm2 = { path = "../../evm2-reference/crates/evm2", default-features = false, features = ["std", "map-foldhash", "sha3-keccak", "no-tco"] }
alloy-primitives = "1.5.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
